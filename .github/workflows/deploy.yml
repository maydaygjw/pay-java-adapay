name: Build and Deploy to Aliyun Yunxiao

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Deployment version suffix, e.g. 2.14.14'
        required: false
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>1666-snapshot-nimFi5</id>
                      <username>${ALIYUN_MAVEN_USERNAME}</username>
                      <password>${ALIYUN_MAVEN_PASSWORD}</password>
                  </server>
              </servers>
              <profiles>
                  <profile>
                      <id>rdc</id>
                      <properties>
                          <altSnapshotDeploymentRepository>1666-snapshot-nimFi5::default::https://holuntech-cn-shanghai.devops.aliyuncs.com/packages/api/protocol/maven/1666-snapshot-nimfi5</altSnapshotDeploymentRepository>
                      </properties>
                      <repositories>
                          <repository>
                              <id>1666-snapshot-nimFi5</id>
                              <url>https://holuntech-cn-shanghai.devops.aliyuncs.com/packages/api/protocol/maven/1666-snapshot-nimfi5</url>
                              <releases>
                                  <enabled>false</enabled>
                              </releases>
                              <snapshots>
                                  <enabled>true</enabled>
                              </snapshots>
                          </repository>
                      </repositories>
                      <pluginRepositories>
                          <pluginRepository>
                              <id>1666-snapshot-nimFi5</id>
                              <url>https://holuntech-cn-shanghai.devops.aliyuncs.com/packages/api/protocol/maven/1666-snapshot-nimfi5</url>
                              <releases>
                                  <enabled>false</enabled>
                              </releases>
                              <snapshots>
                                  <enabled>true</enabled>
                              </snapshots>
                          </pluginRepository>
                      </pluginRepositories>
                  </profile>
              </profiles>
              <activeProfiles>
                  <activeProfile>rdc</activeProfile>
              </activeProfiles>
          </settings>
          EOF
        env:
          ALIYUN_MAVEN_USERNAME: ${{ secrets.ALIYUN_MAVEN_USERNAME }}
          ALIYUN_MAVEN_PASSWORD: ${{ secrets.ALIYUN_MAVEN_PASSWORD }}

      - name: Determine SNAPSHOT version
        id: version
        run: |
          BASE_VERSION=$(grep -oP '(?<=<revision>)[^<]+' pom.xml)
          if [ -n "${{ github.event.inputs.version }}" ]; then
            BASE_VERSION="${{ github.event.inputs.version }}"
          fi
          SNAPSHOT_VERSION="${BASE_VERSION}-SNAPSHOT"
          echo "snapshot_version=${SNAPSHOT_VERSION}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${SNAPSHOT_VERSION}"

      - name: Build and deploy
        run: |
          mvn clean deploy \
            -DskipTests \
            -Drevision=${{ steps.version.outputs.snapshot_version }}
